# Squirrel client-specific overrides; see README.md for installation notes.
# Reference: https://github.com/rime/squirrel/wiki/squirrel.yaml-配置指南
patch:
  keyboard_layout: default
  show_notifications_when: appropriate

  app_options/+:
    org.mozilla.firefox:
      inline: true
    com.github.wez.wezterm:
      ascii_mode: true
      no_inline: true
      vim_mode: false

  "style/color_scheme": lost_temple
  "style/inline_preedit": false
  "style/candidate_list_layout": linear # stack | linear
  "style/text_orientation": horizontal  # vertical | horizontal
